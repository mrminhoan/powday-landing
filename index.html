<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title & Description -->
    <title>Powday</title>
    <meta
      name="description"
      content="Powday giúp bạn tối ưu quy trình, tăng hiệu suất làm việc và quản lý nhóm hiệu quả."
    />

    <!-- Open Graph (Facebook, Zalo, etc.) -->
    <meta property="og:title" content="Powday - Tăng tốc hiệu suất làm việc" />
    <meta
      property="og:description"
      content="Powday là công cụ hỗ trợ quản lý công việc, theo dõi tiến độ và nâng cao năng suất."
    />
    <meta
      property="og:image"
      content="https://yourdomain.com/images/og-image.jpg"
    />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Powday - Tối ưu năng suất làm việc" />
    <meta
      name="twitter:description"
      content="Quản lý nhóm, dự án và thời gian với Powday."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/images/twitter-image.jpg"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
